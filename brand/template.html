<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AidKit</title>
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-brand">
        <h1 class="header-title">
          <span>🩺</span> AidKit
        </h1>
      </div>
      <div class="header-actions" id="header-actions">
        <!-- Profile switcher / Actions -->
      </div>
    </header>

    <main class="app-main">
      <div class="container" id="content-area">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Welcome to AidKit</h2>
          </div>
          <div class="card-body">
            <p>Your offline-first first-aid guide and medicine tracker.</p>
          </div>
        </div>
      </div>
    </main>

    <nav class="app-nav" id="app-nav">
      <button class="nav-item active">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Today</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon">💊</span>
        <span class="nav-label">Meds</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon">🩹</span>
        <span class="nav-label">First Aid</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon">🚨</span>
        <span class="nav-label">SOS</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profiles</span>
      </button>
    </nav>
  </div>
</body>
</html>
